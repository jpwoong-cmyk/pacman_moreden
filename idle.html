<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07090b">
  <title>Idle timeout | P.A.C</title>
  <style>
    :root {
      color-scheme: dark;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #07090b;
      color: #f4f6f8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
      overflow: hidden;
      background:
        linear-gradient(rgba(255, 215, 63, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 215, 63, 0.035) 1px, transparent 1px),
        #07090b;
      background-size: 34px 34px;
    }

    .idle-card {
      width: min(560px, 100%);
      padding: clamp(28px, 7vw, 54px);
      border: 1px solid rgba(255, 216, 74, 0.48);
      background: rgba(12, 15, 19, 0.96);
      box-shadow:
        0 28px 70px rgba(0, 0, 0, 0.58),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      text-align: center;
    }

    .idle-mark {
      display: inline-grid;
      place-items: center;
      width: 62px;
      height: 62px;
      margin-bottom: 22px;
      border: 2px solid #f3ca37;
      border-radius: 50%;
      color: #f3ca37;
      font-size: 1.45rem;
      font-weight: 950;
      letter-spacing: -0.08em;
      box-shadow:
        0 0 24px rgba(243, 202, 55, 0.18),
        inset 0 0 16px rgba(243, 202, 55, 0.08);
    }

    h1 {
      margin: 0;
      color: #ffd84a;
      font-size: clamp(2rem, 9vw, 4rem);
      line-height: 0.98;
      letter-spacing: -0.045em;
    }

    p {
      max-width: 38ch;
      margin: 22px auto 0;
      color: #c9d0d8;
      font-size: clamp(1rem, 3.8vw, 1.18rem);
      line-height: 1.65;
    }

    .status {
      display: block;
      margin-top: 26px;
      color: #77818c;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="idle-card" aria-labelledby="idleTitle">
    <div class="idle-mark" aria-hidden="true">P.C</div>
    <h1 id="idleTitle">Idle timeout</h1>
    <p>Please refresh to continue playing P.A.C.</p>
    <span class="status">Connection paused</span>
  </main>

  <script>
    (function () {
      "use strict";

      var marker = "pac-idle-timeout-page-loaded";

      try {
        if (window.sessionStorage.getItem(marker) === "1") {
          window.sessionStorage.removeItem(marker);
          window.location.replace("./");
          return;
        }

        window.sessionStorage.setItem(marker, "1");
      } catch (_error) {
        /*
         * The page remains usable when session storage is unavailable.
         * The player can return manually by navigating to the site root.
         */
      }
    })();
  </script>
</body>
</html>
